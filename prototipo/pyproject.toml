[project]
name = "inspeccion-tht"
version = "0.1.0"
description = "Estación de inspección visual asistida para uniones soldadas through-hole, con procesamiento local (FEMECI-PUEBLA 2026)"
readme = "README.md"
authors = [
    { name = "Fortino Romero Mantilla", email = "fortino.rom@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "flask>=3.0",
]

[project.scripts]
tht = "inspeccion_tht.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]
servidor = [
    "gunicorn>=23",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
